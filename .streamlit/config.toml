[theme]
primaryColor = "#484aaa"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#e2e8f0"
font = "monospace"

[server]
# Increase the hard limit for file uploads (in megabytes)
maxUploadSize = 500

# Disable XSRF protection (often the culprit for dropping chunked uploads through proxies)
enableXsrfProtection = false

# Disable websocket compression to prevent memory spikes during data transfer
enableWebsocketCompression = false