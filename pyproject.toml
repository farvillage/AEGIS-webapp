[project]
name = "aegis"
version = "0.1.0"
description = "Real-time intrusion detection for private 5G edge networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.25.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "scapy>=2.5.0",
    "requests>=2.28.0"
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"